inventory:function(){
  var searchQ='';
  function render(){
    var prods=Pr.all();
    var pmap={};for(var i=0;i<prods.length;i++)pmap[prods[i].id]=prods[i];
    var movements=Stock.all();
    if(searchQ){
      movements=movements.filter(function(m){
        var p=pmap[m.product_id];
        return p&&(p.name.toLowerCase().indexOf(searchQ.toLowerCase())>=0||(p.barcode||'').indexOf(searchQ)>=0);
      });
    }
    var lowStock=prods.filter(function(p){return p.stock<=S.get('low_stock_threshold',10)});
    var totalCost=U.r2(prods.reduce(function(s,p){return s+p.cost_usd*p.stock},0));
    var totalRetail=U.r2(prods.reduce(function(s,p){return s+p.price_usd*p.stock},0));
    var h='<div class="inner-lay">'+
      '<div class="pg-hd"><h2>Inventory & Stock</h2>'+
      '<div class="pg-hd-a">'+
      '<div class="sb"><i class="fas fa-search"></i><input type="text" id="invS" dir="ltr" placeholder="Search name or barcode..." value="'+U.esc(searchQ)+'"></div>'+
      '<button class="btn btn-p btn-sm" onclick="V.stockAdjust()"><i class="fas fa-plus-circle"></i> Adjust Stock</button></div></div>'+
      '<div class="tx-sum">'+
      '<div class="tx-sc"><div class="lb">Products</div><div class="vl">'+prods.length+'</div></div>'+
      '<div class="tx-sc"><div class="lb">Low Stock</div><div class="vl warn">'+lowStock.length+'</div></div>'+
      '<div class="tx-sc"><div class="lb">Stock Value (Cost)</div><div class="vl">'+U.fmtU(totalCost)+'</div></div>'+
      '<div class="tx-sc"><div class="lb">Stock Value (Retail)</div><div class="vl usd">'+U.fmtU(totalRetail)+'</div></div>'+
      '<div class="tx-sc" style="background:linear-gradient(135deg,var(--aglow),var(--s1));border-color:rgba(0,167,111,.25)"><div class="lb" style="color:var(--accent)"><i class="fas fa-chart-line"></i> Potential Profit</div><div class="vl pf">'+U.fmtU(U.r2(totalRetail-totalCost))+'</div></div></div>'+
      '<div class="dtw"><table class="dt"><thead><tr>'+
      '<th>Product</th><th>Qty</th><th>Type</th><th>Note</th><th>User</th><th>Date & Time</th></tr></thead><tbody>';
    if(movements.length){
      for(var i=0;i<movements.length;i++){
        var m=movements[i];var p=pmap[m.product_id];
        var typeColor=m.type==='sale'?'rgba(220,42,62,.13);color:var(--danger)':(m.type==='edit'?'rgba(37,99,235,.13);color:var(--info)':'rgba(0,167,111,.13);color:var(--accent)');
        h+='<tr>'+
          '<td style="font-weight:600">'+U.esc(p?p.name:m.product_id)+'</td>'+
          '<td style="color:'+(m.quantity<0?'var(--danger)':'var(--accent)')+';font-weight:700;font-family:var(--fd)">'+(m.quantity>0?'+':'')+m.quantity+'</td>'+
          '<td><span class="badge" style="background:'+typeColor+'">'+m.type+'</span></td>'+
          '<td style="font-size:12px">'+U.esc(m.note||'')+'</td>'+
          '<td>'+U.esc(m.user_name)+'</td>'+
          '<td style="font-size:11px">'+U.fmtD(m.created)+' '+U.fmtT(m.created)+'</td></tr>';
      }
    }else h+='<tr><td colspan="6" class="no-data"><i class="fas fa-archive"></i><p>No stock movements</p></td></tr>';
    h+='</tbody></table></div></div>';
    document.getElementById('appContent').innerHTML=h;
    var invS=document.getElementById('invS');
    if(invS)invS.addEventListener('input',function(e){searchQ=e.target.value.trim();render()});
  }

},

stockAdjust:function(){
  var prods=Pr.all();
  var h='<div class="m-hd"><h3>Adjust Stock</h3><button class="m-close" onclick="Modal.close()"><i class="fas fa-times"></i></button></div>'+
    '<div class="m-body">'+
    '<div class="fg"><label>Product</label><select id="adjProd">';
  for(var i=0;i<prods.length;i++)h+='<option value="'+prods[i].id+'">'+U.esc(prods[i].name)+' (stock: '+prods[i].stock+')</option>';
  h+='</select></div>'+
    '<div class="fg"><label>Quantity (positive to add, negative to remove)</label><input type="number" id="adjQty" value="0" step="1"></div>'+
    '<div class="fg"><label>Note</label><input type="text" id="adjNote" placeholder="Reason (e.g. restock, damage)"></div></div>'+
    '<div class="m-foot"><button class="btn btn-s" onclick="Modal.close()">Cancel</button>'+
    '<button class="btn btn-p" onclick="window._doAdj()">Apply</button></div>';
  Modal.open(h);
  window._doAdj=function(){
    var pid=document.getElementById('adjProd').value;
    var qty=parseInt(document.getElementById('adjQty').value)||0;
    var note=document.getElementById('adjNote').value.trim()||'Manual adjustment';
    if(qty===0){Toast.show('Quantity must be non-zero','err');return}
    var p=Pr.byId(pid);if(!p){Toast.show('Product not found','err');return}
    var newStock=Math.max(0,p.stock+qty);
    Pr.update(pid,{stock:newStock});
    Stock.add({product_id:pid,quantity:qty,type:qty>0?'restock':'adjustment',note:note,user_name:Auth.name()});
    Toast.show('Stock updated to '+newStock,'ok');Modal.close();V.inventory();
  };
},

        '<div><span>Firebase</span><strong>'+status+'</strong></div>'+
        '<div><span>Realtime Sync</span><strong>'+syncStatus+'</strong></div>'+
        '<div><span>Last manual push</span><strong>'+U.esc(lastSync)+'</strong></div>'+
        '<div><span>Project</span><strong style="font-family:var(--fd)">hyperpos-12210</strong></div>'+
        '<div><span>Auto-sync</span><strong>'+(Cloud._autoSync ? 'Enabled' : 'Disabled')+'</strong></div>'+

    '<div class="sg"><h4>Actions</h4>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
        '<button class="btn btn-p" onclick="Cloud.push()"><i class="fas fa-cloud-upload-alt"></i> Force Full Push</button>'+
        '<button class="btn btn-s" onclick="Cloud.pull()"><i class="fas fa-cloud-download-alt"></i> Force Full Pull</button>'+
        '<button class="btn btn-s" onclick="Cloud.seed()"><i class="fas fa-seedling"></i> Seed Demo Data</button>'+
        '<button class="btn btn-d" onclick="Cloud.clear()"><i class="fas fa-trash"></i> Clear Cloud</button>'+
      '</div>'+
      '<div class="hint" style="margin-top:12px;font-size:12px;color:var(--text3)">'+
        'Realtime sync is on by default: every write to SQLite is diff-pushed to Firestore, and every Firestore change lands in SQLite within ~1 second. '+
        'The buttons above are manual escape hatches — use them only when you need a full overwrite in one direction.<br><br>'+
        '<strong>Force Full Push</strong> uploads everything (upsert, safe).<br>'+
        '<strong>Force Full Pull</strong> wipes local SQLite and replaces with the cloud copy, then reloads.<br>'+
        '<strong>Seed Demo Data</strong> writes default users, categories, products and settings straight into Firestore — realtime sync loads them locally within a second.<br>'+
        '<strong>Clear Cloud</strong> wipes every Firestore collection. Local SQLite is untouched (but will re-push on next change).'+
      '</div>'+
    '</div>'+
    '<div class="sg"><h4>Auto Sync</h4>'+
      '<div class="sr"><div class="sr-label">Realtime sync</div><div class="sr-ctrl">'+
        '<label class="tog"><input type="checkbox" id="cs_auto" '+(Cloud._autoSync?'checked':'')+' onchange="Cloud.setAuto(this.checked)"><span class="tog-sl"></span></label>'+

      '<div class="hint" style="font-size:11px;color:var(--text3)">When enabled, changes are pushed ~400 ms after each write (debounced). Consider Firestore free-tier write limits if you have high transaction volume — otherwise leave it on.</div>'+
    '</div>'+
  '</div>';
},

_sDB:function(){
  var tables=[
    ['users',dbVal("SELECT COUNT(*) FROM users",0)],
    ['categories',dbVal("SELECT COUNT(*) FROM categories",0)],
    ['products',dbVal("SELECT COUNT(*) FROM products",0)],
    ['transactions',dbVal("SELECT COUNT(*) FROM transactions",0)],
    ['transaction_items',dbVal("SELECT COUNT(*) FROM transaction_items",0)],
    ['settings',dbVal("SELECT COUNT(*) FROM settings",0)],
    ['held_orders',dbVal("SELECT COUNT(*) FROM held_orders",0)],
    ['stock_movements',dbVal("SELECT COUNT(*) FROM stock_movements",0)],
    ['daily_closes',dbVal("SELECT COUNT(*) FROM daily_closes",0)]
  ];
  var sz=0;try{sz=db.export().length}catch(e){}
  var rawTx=dbRows("SELECT id,created,total_usd FROM transactions ORDER BY created DESC LIMIT 8");
  var txCols=actualColumns("transactions");
  var tiCols=actualColumns("transaction_items");
  var h='<div class="set-sec"><h2>SQLite Database</h2><p class="sd">Diagnostics, schema info, SQL console.</p>'+
    '<div class="sg"><h4>Status</h4><div class="kv" style="grid-template-columns:1fr 1fr">'+
    '<div><span>Engine</span><strong>SQLite 3 (WASM)</strong></div>'+
    '<div><span>Size</span><strong>'+(sz/1024).toFixed(1)+' KB</strong></div>'+
    '<div><span>Local date</span><strong>'+U.today()+'</strong></div>'+
    '<div><span>DB errors</span><strong style="color:'+(DB_ERRORS.length?'var(--danger)':'var(--accent)')+'">'+DB_ERRORS.length+'</strong></div></div></div>'+
    '<div class="sg"><h4>Transactions Schema ('+txCols.length+' cols)</h4>'+
    '<div style="font-family:monospace;font-size:11px;color:var(--text2);padding:8px;background:var(--s2);border-radius:var(--rs);word-break:break-word">'+U.esc(txCols.join(', '))+'</div>'+
    (txCols.length!==SCHEMAS.transactions.length?'<div style="margin-top:8px;color:var(--danger);font-size:12px"><i class="fas fa-exclamation-triangle"></i> Mismatch: expected '+SCHEMAS.transactions.length+' columns — will be repaired on reload</div>':'<div style="margin-top:8px;color:var(--accent);font-size:12px"><i class="fas fa-check-circle"></i> Schema matches expected</div>')+
    '</div>'+
    '<div class="sg"><h4>Transaction Items Schema ('+tiCols.length+' cols)</h4>'+
    '<div style="font-family:monospace;font-size:11px;color:var(--text2);padding:8px;background:var(--s2);border-radius:var(--rs);word-break:break-word">'+U.esc(tiCols.join(', '))+'</div></div>';
  if(DB_ERRORS.length){
    h+='<div class="sg"><h4 style="color:var(--danger)">Recent DB Errors</h4>'+
      '<div class="err-log">'+DB_ERRORS.slice(-15).map(U.esc).join('\n')+'</div>'+
      '<button class="btn btn-s btn-sm" style="margin-top:8px" onclick="DB_ERRORS=[];V.settings()">Clear log</button></div>';
  }
  h+='<div class="sg"><h4>Tables</h4><div style="overflow-x:auto"><table class="dt" style="min-width:260px"><thead><tr><th>Table</th><th>Rows</th></tr></thead><tbody>';
  for(var i=0;i<tables.length;i++)h+='<tr><td style="font-weight:600;font-family:var(--fd)">'+tables[i][0]+'</td><td>'+tables[i][1]+'</td></tr>';
  h+='</tbody></table></div></div>';
  h+='<div class="sg"><h4>Raw Transactions (last 8)</h4>'+
    '<div style="overflow-x:auto"><table class="dt" style="min-width:520px"><thead><tr><th>ID</th><th>Created (raw)</th><th>Date slice</th><th>Total</th></tr></thead><tbody>';
  if(rawTx.length){
    for(var i=0;i<rawTx.length;i++){
      var r=rawTx[i];
      h+='<tr>'+
        '<td style="font-family:var(--fd);font-size:10px">'+U.esc(r.id)+'</td>'+
        '<td style="font-size:10px;font-family:monospace">'+U.esc(r.created)+'</td>'+
        '<td style="font-size:10px;font-family:monospace;color:var(--accent);font-weight:700">'+U.esc(String(r.created||'').slice(0,10))+'</td>'+
        '<td>'+U.fmtU(r.total_usd)+'</td></tr>';
    }
  }else{
    h+='<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:20px">No transactions in DB yet</td></tr>';
  }
  h+='</tbody></table></div></div>';
  h+='<div class="sg"><h4>SQL Console</h4>'+
    '<div class="fg"><label>Run SELECT query (read-only)</label>'+
    '<textarea id="sqlQ" rows="3" style="font-family:monospace;font-size:12px" placeholder="SELECT * FROM transactions LIMIT 5">SELECT * FROM transactions LIMIT 5</textarea></div>'+
    '<button class="btn btn-p btn-sm" onclick="window._runSql()"><i class="fas fa-play"></i> Run</button>'+
    '<div id="sqlOut" style="margin-top:12px"></div></div>';
  h+='<div class="sg"><h4>Maintenance</h4>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
    '<button class="btn btn-s" onclick="window._repairNow()"><i class="fas fa-wrench"></i> Repair Schema Now</button>'+
    '</div>'+
    '<div class="hint" style="margin-top:8px;font-size:11px;color:var(--text3)">Rebuilds transactions/transaction_items tables if their schema drifted. Data in shared columns is preserved.</div>'+
    '</div>';
  h+='<div class="sg"><h4>File Operations</h4>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
    '<button class="btn btn-p" onclick="window._saveDB()"><i class="fas fa-download"></i> Save .db</button>'+
    '<button class="btn btn-s" onclick="document.getElementById(\'dbFileInput\').click()"><i class="fas fa-upload"></i> Load .db</button>'+
    '<button class="btn btn-d btn-sm" onclick="V._resetDB()"><i class="fas fa-exclamation-triangle"></i> Reset DB</button></div></div>';
  h+='</div>';
  setTimeout(function(){
    window._runSql=function(){
      var q=document.getElementById('sqlQ').value.trim();
      if(!q){return}
      if(!/^select|^pragma|^explain/i.test(q)){Toast.show('Only SELECT/PRAGMA allowed','err');return}
      try{
        var res=dbRows(q);
        var out=document.getElementById('sqlOut');
        if(!res.length){out.innerHTML='<div style="color:var(--text3);font-size:12px">0 rows</div>';return}
        var cols=Object.keys(res[0]);
        var t='<div style="font-size:11px;color:var(--text2);margin-bottom:6px">'+res.length+' row(s)</div>'+
          '<div style="max-height:300px;overflow:auto"><table class="tx-detail-table" style="min-width:'+(cols.length*100)+'px"><thead><tr>';
        for(var i=0;i<cols.length;i++)t+='<th>'+U.esc(cols[i])+'</th>';
        t+='</tr></thead><tbody>';
        for(var i=0;i<res.length;i++){
          t+='<tr>';
          for(var j=0;j<cols.length;j++){
            var v=res[i][cols[j]];
            t+='<td style="font-size:11px;font-family:monospace">'+U.esc(v===null?'NULL':String(v))+'</td>';
          }
          t+='</tr>';
        }
        t+='</tbody></table></div>';
        out.innerHTML=t;
      }catch(e){
        document.getElementById('sqlOut').innerHTML='<div class="err-log">'+U.esc(e.message)+'</div>';
      }
    };
    window._repairNow=function(){
      var ok=false;
      if(schemaMismatch('transactions')){
        ok=repairTable('transactions',
          "CREATE TABLE transactions (id TEXT PRIMARY KEY, subtotal_usd REAL NOT NULL DEFAULT 0, tax_usd REAL NOT NULL DEFAULT 0, total_usd REAL NOT NULL DEFAULT 0, total_lbp INTEGER NOT NULL DEFAULT 0, paid_usd REAL NOT NULL DEFAULT 0, paid_lbp INTEGER NOT NULL DEFAULT 0, change_usd REAL NOT NULL DEFAULT 0, change_lbp INTEGER NOT NULL DEFAULT 0, payment_method TEXT NOT NULL, user_name TEXT NOT NULL, created TEXT NOT NULL)",
          SCHEMAS.transactions);
      }
      if(schemaMismatch('transaction_items')){
        ok=repairTable('transaction_items',
          "CREATE TABLE transaction_items (id TEXT PRIMARY KEY, transaction_id TEXT NOT NULL, product_id TEXT NOT NULL, product_name TEXT NOT NULL, price_usd REAL NOT NULL, quantity INTEGER NOT NULL, cost_usd REAL NOT NULL DEFAULT 0)",
          SCHEMAS.transaction_items) || ok;
      }
      scheduleSave();
      Toast.show(ok?'Schema repaired':'Schema already OK','ok');
      V.settings();
    };
  },50);
  return h;
},

userForm:function(id){
  var u=id?Usr.byId(id):null;
  var ie=!!u;
  var h='<div class="m-hd"><h3>'+(ie?'Edit':'Add')+' User</h3><button class="m-close" onclick="Modal.close()"><i class="fas fa-times"></i></button></div>'+
    '<div class="m-body">'+
    '<div class="fg"><label>Full Name</label><input type="text" id="ufN" value="'+U.esc(u?u.name:'')+'"></div>'+
    '<div class="fg"><label>Username</label><input type="text" id="ufU" value="'+U.esc(u?u.username:'')+'" '+(ie?'readonly style="opacity:.6"':'')+'"></div>'+
    '<div class="fg"><label>'+(ie?'New Password (blank=keep)':'Password')+'</label><input type="password" id="ufP"></div>'+
    '<div class="fg"><label>Role</label><select id="ufR">'+
    '<option value="admin" '+(u&&u.role==='admin'?'selected':'')+'>Admin</option>'+
    '<option value="cashier" '+(u&&u.role==='cashier'?'selected':'')+'>Cashier</option></select></div></div>'+
    '<div class="m-foot"><button class="btn btn-s" onclick="Modal.close()">Cancel</button>'+
    '<button class="btn btn-p" onclick="window._su(\''+(id||'')+'\')">'+(ie?'Update':'Add')+'</button></div>';
  Modal.open(h);
  window._su=function(eid){
    var name=document.getElementById('ufN').value.trim();
    var username=document.getElementById('ufU').value.trim();
    var password=document.getElementById('ufP').value;
    var role=document.getElementById('ufR').value;
    if(!name||!username){Toast.show('Name and username required','err');return}
    if(!ie&&!password){Toast.show('Password required','err');return}
    if(!ie&&Usr.byUN(username)){Toast.show('Username taken','err');return}
    var d={name:name,role:role};
    if(password)d.password=password;
    if(eid){Usr.update(eid,d);Toast.show('Updated','ok')}else{d.username=username;Usr.add(d);Toast.show('Added','ok')}
    Modal.close();V.settings();
  };
},

_resetDB:function(){
  Modal.open('<div class="m-hd"><h3 style="color:var(--danger)">Reset Database</h3><button class="m-close" onclick="Modal.close()"><i class="fas fa-times"></i></button></div>'+
    '<div class="m-body"><p>Drop all tables and recreate with defaults? This will erase all data.</p></div>'+
    '<div class="m-foot"><button class="btn btn-s" onclick="Modal.close()">Cancel</button>'+
    '<button class="btn btn-d" onclick="window._doReset()">Reset</button></div>');
}
};

window._saveDB=function(){
  try{
    var data=db.export();
    var blob=new Blob([data],{type:'application/x-sqlite3'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='propos-'+U.today()+'.db';a.click();
    URL.revokeObjectURL(url);
    Toast.show('Saved ('+(data.length/1024).toFixed(1)+' KB)','ok');
  }catch(e){Toast.show('Error: '+e.message,'err')}
};
document.getElementById('dbFileInput').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      db.close();db=new SQL.Database(new Uint8Array(ev.target.result));
      initDb();scheduleSave();Toast.show('Loaded: '+file.name,'ok');
      if(Auth.admin())Router.render();else{Auth.logout();showLogin()}
    }catch(err){
      Toast.show('Invalid file: '+err.message,'err');
      db=new SQL.Database();initDb();
    }
  };
  reader.readAsArrayBuffer(file);e.target.value='';
});
window._doReset=function(){
  db.close();db=new SQL.Database();initDb();scheduleSave();
  DB_ERRORS=[];
  Modal.close();Toast.show('Database reset','ok');Auth.logout();showLogin();
};

  if(ia){
    h+='<button class="mn-b '+(Router.cur==='products'?'on':'')+'" data-p="products" onclick="Router.nav(\'products\')"><i class="fas fa-box"></i><span>Products</span></button>';

function showLogin(){
  document.getElementById('loginView').style.display='flex';
  document.getElementById('mainView').classList.remove('on');
  document.getElementById('lUser').value='';
  document.getElementById('lPass').value='';
  var err=document.getElementById('loginErr');err.textContent='';err.className='login-err';
  var st=document.getElementById('dbStatus');
  var cnt=dbVal("SELECT COUNT(*) FROM users",0);
  var txCnt=dbVal("SELECT COUNT(*) FROM transactions",0);
  st.innerHTML='<span style="color:var(--accent)"><i class="fas fa-check-circle"></i> SQLite — '+cnt+' user(s), '+txCnt+' transaction(s)</span>';
  setTimeout(function(){document.getElementById('lUser').focus()},100);
}
function showMain(){
  document.getElementById('loginView').style.display='none';
  document.getElementById('mainView').classList.add('on');
  renderHeader();Router.nav('pos');
}
function doLogin(){
  var un=document.getElementById('lUser').value.trim();
  var pw=document.getElementById('lPass').value;
  var err=document.getElementById('loginErr');
  if(!un||!pw){err.textContent='Enter username and password';err.className='login-err err';return}
  var adminCheck=dbRow("SELECT * FROM users WHERE username='admin'");
  if(!adminCheck){dbRun("INSERT OR IGNORE INTO users (id,username,password,name,role,created) VALUES ('u1','admin','admin123','Administrator','admin',"+sq(U.now())+")");scheduleSave()}
  var user=Usr.byUN(un);
  if(!user){err.textContent='User not found';err.className='login-err err';errBeep();return}
  if(user.password!==pw){err.textContent='Incorrect password';err.className='login-err err';errBeep();return}
  Auth._u=user;showMain();
}

document.getElementById('lBtn').addEventListener('click',doLogin);
document.getElementById('lPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
document.getElementById('lUser').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('lPass').focus()});

document.addEventListener('keydown',function(e){
  if(!document.getElementById('mainView').classList.contains('on'))return;
  var tag=e.target.tagName;
  var isInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(e.key==='F2'){e.preventDefault();var s=document.getElementById('posSI');if(s){s.focus();s.select()}}
  if(e.key==='F4'&&!isInput){e.preventDefault();if(Router.cur==='pos'&&POS.cart.length)V.payment()}
  if(e.key==='F8'&&!isInput){e.preventDefault();if(Router.cur==='pos'&&POS.cart.length)POS.hold()}
  if(e.key==='F10'&&!isInput){e.preventDefault();if(Router.cur==='pos'&&POS.cart.length)POS.clear()}
  if(e.key==='F12'&&!isInput){e.preventDefault();Print.drawer()}
  if(e.key==='Escape')Modal.close();
});

/* ============================================================
   Boot
   ============================================================ */
(function(){
  var bar=document.getElementById('ldBar'),status=document.getElementById('ldStatus'),errEl=document.getElementById('ldErr');
  function fail(m){errEl.textContent=m;status.textContent='Failed';bar.style.background='var(--danger)';bar.style.width='100%'}
  if(typeof WebAssembly==='undefined'){fail('WebAssembly not supported.');return}
  if(!window.indexedDB){fail('IndexedDB not available.');return}
  bar.style.width='20%';status.textContent='Loading sql.js WASM module...';
  initSqlJs({locateFile:function(f){return'https://sql.js.org/dist/'+f}}).then(function(sqlJs){
    SQL=sqlJs;bar.style.width='50%';status.textContent='WASM loaded. Opening database...';
    return IDB.open();
  }).then(function(){
    bar.style.width='70%';status.textContent='IndexedDB ready. Loading database...';
    return IDB.load();
  }).then(function(saved){
    bar.style.width='85%';status.textContent='Checking schema...';
    if(saved&&saved.byteLength>100){try{db=new SQL.Database(new Uint8Array(saved))}catch(e){db=new SQL.Database()}}
    else{db=new SQL.Database()}
    initDb();

    try { PWA.init(); } catch(e){ console.warn('PWA init:', e.message); }

    bar.style.width='100%';status.textContent='Ready!';
    setTimeout(function(){
      document.getElementById('loadScreen').style.display='none';
      var a=dbRow("SELECT * FROM users WHERE username='admin'");
      if(!a){dbRun("INSERT OR IGNORE INTO users (id,username,password,name,role,created) VALUES ('u1','admin','admin123','Administrator','admin',"+sq(U.now())+")");scheduleSave()}
      showLogin();
    },400);
  }).catch(function(err){fail('Error: '+err.message);console.error('Init:',err)});
})();
</script>
